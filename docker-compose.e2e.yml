services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://test_user:test_password@db:5432/test_db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: ./backend/worker/Dockerfile
    command: ["python", "worker/worker.py"]
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/worker:/app/worker:ro
    environment:
      DATABASE_URL: postgresql://test_user:test_password@db:5432/test_db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://test_user:test_password@db:5432/test_db
      BASE_URL: http://backend:8000
    command:
      [
        "sh",
        "-c",
        "pip install pytest httpx2 >/tmp/pip-install.log 2>&1 && python -m pytest -q -m \"e2e and not load\" tests/e2e",
      ]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
