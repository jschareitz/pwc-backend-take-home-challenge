services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: load_user
      POSTGRES_PASSWORD: load_password
      POSTGRES_DB: load_db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load_user -d load_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://load_user:load_password@db:5432/load_db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: ./backend/worker/Dockerfile
    command: ["python", "worker/worker.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://load_user:load_password@db:5432/load_db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      # Optional tuning for faster load-test cycles.
      WORKER_MIN_WORK_SECONDS: ${WORKER_MIN_WORK_SECONDS:-0.05}
      WORKER_MAX_WORK_SECONDS: ${WORKER_MAX_WORK_SECONDS:-0.20}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-0.05}
      WORKER_FAILURE_RATE: ${WORKER_FAILURE_RATE:-0.0}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  load_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://load_user:load_password@db:5432/load_db
      BASE_URL: http://backend:8000
      LOAD_REQUESTS: ${LOAD_REQUESTS:-500}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-50}
      LOAD_TIMEOUT_SECONDS: ${LOAD_TIMEOUT_SECONDS:-300}
    command:
      [
        "sh",
        "-c",
        "pip install pytest httpx2 >/tmp/pip-install.log 2>&1 && python -m pytest -q -s -m load tests/e2e",
      ]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
